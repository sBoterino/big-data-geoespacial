# Big Data Geoespacial — orquestación completa.
#
#   Aplicación:  docker compose up -d --build
#   CI (Jenkins + webhook):  docker compose --profile ci up -d --build
#   Jobs puntuales:  docker compose run --rm dask-job python check_cluster.py
#
# Reglas de este archivo:
#  - Sin bind mounts de código: todo se copia a las imágenes. Cuando Jenkins despliega a
#    través del socket, las rutas de un bind mount se resolverían en el host (riesgo R4).
#  - Los secretos llegan por variables de entorno: .env en local, credenciales en Jenkins.
#  - Los límites de memoria son variables para ajustarlos al computador (y al benchmark).

name: bdgeo

x-mongo-env: &mongo-env
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DB: ${MONGO_DB:-geo}
  MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
  MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD en .env o en la credencial mongo-root de Jenkins}"

services:

  # ---------------------------------------------------------------- MongoDB
  mongodb:
    build: ./mongo
    image: bdgeo-mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD}"
      MONGO_DB: ${MONGO_DB:-geo}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEM:-1536m}
    networks: [bdgeo]
    restart: unless-stopped

  # ---------------------------------------------------------------- Spark
  spark-master:
    build: ./spark
    image: bdgeo-spark:latest
    hostname: spark-master          # los executors se conectan de vuelta al driver por este nombre
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      <<: *mongo-env
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8081:8080"                 # UI del master (8080 del host queda para Jenkins)
      - "7077:7077"
    volumes:
      - kaggle_data:/data           # mismo volumen que Dask: el benchmark lee el mismo Parquet (D5)
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${SPARK_MASTER_MEM:-1g}
    networks: [bdgeo]
    restart: unless-stopped

  spark-worker: &spark-worker
    build: ./spark
    image: bdgeo-spark:latest
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-1536m}"]
    environment:
      <<: *mongo-env
    volumes:
      - kaggle_data:/data
    depends_on:
      spark-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${SPARK_WORKER_CONTAINER_MEM:-2g}
    networks: [bdgeo]
    restart: unless-stopped

  # Segundo worker de Spark, solo para la configuración B del benchmark (perfil "bench").
  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2
    profiles: [bench]

  # ---------------------------------------------------------------- Dask
  dask-scheduler:
    build: ./ingest
    image: bdgeo-dask:latest
    command: ["dask", "scheduler", "--dashboard-address", ":8787"]
    ports:
      - "8787:8787"                 # dashboard de Dask
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8786), 2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${DASK_SCHEDULER_MEM:-512m}
    networks: [bdgeo]
    restart: unless-stopped

  dask-worker-1: &dask-worker
    build: ./ingest
    image: bdgeo-dask:latest
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--name", "dask-worker-1",
              "--nthreads", "${DASK_WORKER_THREADS:-2}", "--memory-limit", "${DASK_WORKER_MEMORY:-1.5GiB}"]
    environment:
      <<: *mongo-env
    volumes:
      - kaggle_data:/data
    depends_on:
      dask-scheduler:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${DASK_WORKER_CONTAINER_MEM:-2g}
    networks: [bdgeo]
    restart: unless-stopped

  dask-worker-2:
    <<: *dask-worker
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--name", "dask-worker-2",
              "--nthreads", "${DASK_WORKER_THREADS:-2}", "--memory-limit", "${DASK_WORKER_MEMORY:-1.5GiB}"]

  # Contenedor cliente para jobs puntuales de Dask (verificación, ingesta, benchmark).
  dask-job:
    build: ./ingest
    image: bdgeo-dask:latest
    profiles: [jobs]
    environment:
      <<: *mongo-env
      DASK_SCHEDULER: tcp://dask-scheduler:8786
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_DATASET: ${KAGGLE_DATASET:-muzammilrizvi1/motor-vehicle-collisions-crashes}
      INGEST_MAX_ROWS: ${INGEST_MAX_ROWS:-0}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-5000}
      FORCE_RELOAD: ${FORCE_RELOAD:-false}
    volumes:
      - kaggle_data:/data
    depends_on:
      dask-scheduler:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [bdgeo]

  # ---------------------------------------------------------------- API
  api:
    build:
      context: ./api
      target: runtime
    image: bdgeo-api:${API_TAG:-latest}   # Jenkins etiqueta cada versión con el número de build
    environment:
      <<: *mongo-env
      MONGO_COLLECTION: ${MONGO_COLLECTION:-eventos}
      APP_VERSION: ${API_TAG:-latest}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEM:-512m}
    networks: [bdgeo]
    restart: unless-stopped

  # ---------------------------------------------------------------- CI/CD (perfil "ci")
  # Separado en un perfil para que el deploy del pipeline NUNCA recree Jenkins (riesgo R3).
  jenkins:
    build: ./jenkins
    image: bdgeo-jenkins:latest
    profiles: [ci]
    user: root                      # necesario para usar el socket de Docker (decisión D9)
    environment:
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: ${JENKINS_MEM:-2g}
    networks: [bdgeo]
    restart: unless-stopped

  # Reenvía los webhooks de GitHub a Jenkins sin exponer Jenkins a internet (decisión D8).
  smee:
    image: node:20-alpine
    profiles: [ci]
    environment:
      SMEE_URL: ${SMEE_URL:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$SMEE_URL" ]; then echo "Definir SMEE_URL en .env (ver docs/guia_fase2.md)"; exit 1; fi
        exec npx --yes smee-client@2 --url "$$SMEE_URL" --target http://jenkins:8080/github-webhook/
    depends_on: [jenkins]
    networks: [bdgeo]
    restart: unless-stopped

networks:
  bdgeo:
    name: bdgeo-net

volumes:
  mongo_data:
  kaggle_data:
  jenkins_home:
